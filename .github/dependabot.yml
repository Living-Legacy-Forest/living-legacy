version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Australia/Melbourne
    open-pull-requests-limit: 5
    # Wait until a release is 2 days old before proposing it. Bun rejects
    # anything published within 24 hours (minimumReleaseAge in bunfig.toml),
    # so without this Dependabot opens PRs that CI cannot pass until the
    # packages age out.
    cooldown:
      default-days: 2
    groups:
      astro-ecosystem:
        patterns:
          - 'astro'
          - '@astrojs/*'
      sanity:
        patterns:
          - 'sanity'
          - '@sanity/*'
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
      lucide:
        patterns:
          - 'lucide-astro'
    ignore:
      - dependency-name: 'astro'
        update-types: ['version-update:semver-major']
      - dependency-name: 'sanity'
        update-types: ['version-update:semver-major']
      - dependency-name: 'tailwindcss'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Australia/Melbourne
    open-pull-requests-limit: 3
