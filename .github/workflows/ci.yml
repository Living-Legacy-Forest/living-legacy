name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  # commitlint reads the PR's commit list via the API on pull_request events.
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (secrets, audit, types, lint, format, build, commits)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scanning (gitleaks)
        run: |
          # Extract outside the checkout: the tarball ships its own README.md and
          # LICENSE, which otherwise overwrite the repo's files and get scanned,
          # linted and format-checked by the steps below.
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.27.2/gitleaks_8.27.2_linux_x64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks/gitleaks" detect --source . --config .gitleaks.toml --redact

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Version comes from the "packageManager" field in package.json.
          bun-version-file: package.json

      - name: Setup Node
        # Astro, ESLint and the scripts run under Node via their shebangs.
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit --audit-level=critical

      - name: Type-check
        run: bun run type-check

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Lint commits
        uses: wagoid/commitlint-github-action@v6
        with:
          # The action defaults to commitlint.config.mjs; this repo uses .cjs.
          # Without this it silently falls back to a preset that cannot parse
          # breaking-change headers such as "feat!: ...".
          configFile: ./commitlint.config.cjs
