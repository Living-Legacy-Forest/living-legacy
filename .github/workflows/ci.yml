name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  # commitlint reads the PR's commit list via the API on pull_request events.
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build + type-check + commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scanning (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.27.2/gitleaks_8.27.2_linux_x64.tar.gz | tar -xz
          ./gitleaks detect --source . --config .gitleaks.toml --redact

      - name: Setup pnpm
        # Version comes from the "packageManager" field in package.json.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=critical

      - name: Type-check
        run: pnpm type-check

      - name: Build
        run: pnpm build

      - name: Lint commits
        uses: wagoid/commitlint-github-action@v6
        with:
          # The action defaults to commitlint.config.mjs; this repo uses .cjs.
          # Without this it silently falls back to a preset that cannot parse
          # breaking-change headers such as "feat!: ...".
          configFile: ./commitlint.config.cjs
