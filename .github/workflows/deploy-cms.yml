name: Deploy CMS

# Pull request to master: upload an isolated preview version and comment its URL.
# Push to master: apply D1 migrations, then deploy the living-legacy-cms Worker.

on:
  push:
    branches: [master]
    paths:
      - 'apps/cms/**'
      - 'packages/**'
      - 'bun.lock'
      - 'package.json'
      - '.node-version'
      - '.github/workflows/deploy-cms.yml'
  pull_request:
    branches: [master]
    paths:
      - 'apps/cms/**'
      - 'packages/**'
      - 'bun.lock'
      - 'package.json'
      - '.node-version'
      - '.github/workflows/deploy-cms.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push cancels a stale preview, but production deploys queue so a
  # migration is never interrupted halfway.
  group: deploy-cms-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cms:
    name: ${{ github.event_name == 'pull_request' && 'Preview' || 'Deploy' }} CMS
    # Dependabot and fork PRs cannot read the Cloudflare secrets.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # sticky preview comment
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FORCE_COLOR: 0
    defaults:
      run:
        working-directory: apps/cms
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install (frozen lockfile)
        working-directory: .
        run: bun install --frozen-lockfile

      # Before the build: the build writes a redirected deploy config that d1
      # commands must not pick up. Previews share the production database, so
      # only a production deploy migrates it.
      - name: Apply D1 migrations
        if: github.event_name != 'pull_request'
        run: bunx wrangler d1 migrations apply DB --remote

      - name: Build
        run: bun run build

      - name: Upload preview version
        id: preview
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -o pipefail
          bunx wrangler versions upload --message "PR #$PR_NUMBER" 2>&1 | tee "$RUNNER_TEMP/wrangler.log"
          url=$(sed -n 's/.*Version Preview URL: \(https:[^ ]*\).*/\1/p' "$RUNNER_TEMP/wrangler.log" | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: github.event_name != 'pull_request'
        run: bunx wrangler deploy

      - name: Comment preview URL
        if: steps.preview.outputs.url != ''
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          comment-tag: cms-preview
          message: |
            ### CMS preview

            ${{ steps.preview.outputs.url }}

            Isolated version; the live CMS is untouched. It reads the production
            database, and any migrations in this PR only run after merge.
