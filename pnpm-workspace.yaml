# pnpm settings. The pnpm version itself is pinned by "packageManager" in
# package.json, which both local dev and CI resolve from — so this file is the
# single source of truth for overrides.

overrides:
  # GHSA-23hp-3jrh-7fpw (critical): node-tar decompression DoS. Reaches us only
  # through @sanity/cli (studio tooling), never the deployed Worker, but the CI
  # audit gate fails on it.
  tar: '>=7.5.19'

# Refuse packages published within the last 24 hours, so a compromised release
# has time to be caught and pulled before it can reach us. This is pnpm 11's
# default, stated explicitly so the behaviour is intentional and survives any
# change to that default. Dependabot's cooldown in .github/dependabot.yml is set
# above this window so the two do not contradict each other.
minimumReleaseAge: 1440

# Build scripts have never run for these and the build is verified working
# without them, so this records the status quo rather than changing behaviour.
allowBuilds:
  core-js: false
  esbuild: false
  sharp: false
  workerd: false
